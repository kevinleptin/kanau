<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb26b"/>
      <stop offset="1" stop-color="#ff6a3d"/>
    </linearGradient>
  </defs>

  <!-- 圆角背景（maskable 安全区内容集中在中部 80%） -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 彩虹：四道圆弧 -->
  <g fill="none" stroke-linecap="round">
    <path d="M 106 344 A 150 150 0 0 1 406 344" stroke="#ffffff" stroke-width="30"/>
    <path d="M 138 344 A 118 118 0 0 1 374 344" stroke="#ffe680" stroke-width="30"/>
    <path d="M 170 344 A 86 86 0 0 1 342 344" stroke="#9be8c0" stroke-width="30"/>
    <path d="M 202 344 A 54 54 0 0 1 310 344" stroke="#8ecbff" stroke-width="30"/>
  </g>

  <!-- 彩虹两端的云朵 -->
  <g fill="#ffffff">
    <circle cx="106" cy="344" r="34"/>
    <circle cx="76" cy="360" r="24"/>
    <circle cx="136" cy="362" r="24"/>
    <circle cx="406" cy="344" r="34"/>
    <circle cx="376" cy="362" r="24"/>
    <circle cx="436" cy="360" r="24"/>
  </g>

  <!-- 星星：梦想的象征 -->
  <path fill="#fff3b0" stroke="#ffe680" stroke-width="6" stroke-linejoin="round"
        d="M 256 84 L 271 128 L 317 130 L 281 158 L 294 202 L 256 176 L 218 202 L 231 158 L 195 130 L 241 128 Z"/>
  <!-- 小星点缀 -->
  <circle cx="150" cy="140" r="10" fill="#fff3b0"/>
  <circle cx="368" cy="112" r="8" fill="#fff3b0"/>
  <circle cx="396" cy="180" r="6" fill="#ffffff" opacity="0.85"/>
</svg>
